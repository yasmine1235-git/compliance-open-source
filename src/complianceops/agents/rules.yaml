# DRAFT compliance rules. Not reviewed by a compliance professional, and not legal advice.
#
# Unless stated otherwise, rules come from ESMA34-45-1272, Guidelines on marketing communications:
# https://www.esma.europa.eu/sites/default/files/library/esma34-45-1272_guidelines_on_marketing_communications.pdf
#
# `quote` is copied from the source. The French patterns are our own translations, not official
# wording, and need review. Patterns run on text with accents removed and are case-insensitive.
#
# `trigger`: the rule only applies if one of these patterns is found.
# `required`: every one of these patterns must be found.
# `before_trigger`: the first required pattern must appear before the trigger.

- id: MC-IDENT-001
  agent: disclaimer_agent
  title: The document identifies itself as a marketing communication
  source: ESMA34-45-1272
  paragraph: "6"
  quote: a marketing communication should be deemed to be identified as such when it includes a prominent disclosure of the terms
  required:
    - '#?marketing ?communication|communication (marketing|publicitaire)'

- id: MC-DISC-001
  agent: disclaimer_agent
  title: The document refers to the prospectus and the KID or KIID
  source: ESMA34-45-1272
  paragraph: "7"
  quote: marketing communications should include a disclaimer such as the following
  required:
    - '\bprospectus\b'
    - "\\b(kiid|kid|dici|dic|key (investor )?information document|document d.informations? cles)\\b"

- id: MC-PERF-001
  agent: disclaimer_agent
  title: Past performance is preceded by the required statement
  source: ESMA34-45-1272
  paragraph: "47"
  quote: this information should be preceded by the following statement
  trigger:
    - '\bpast performance\b'
    - '\bperformance history\b'
    - '\bhistorical (performance|returns?)\b'
    - '\bannual(i[sz]ed)? (returns?|performance)\b'
    - '\bperformances? passees?\b'
    - '\bperformances? annuali[sz]ees?\b'
  required:
    - 'past performance does not predict future returns|performances passees ne (predisent|prejugent) pas (des |les )?(rendements|performances|resultats) futur'
  before_trigger: true

- id: MC-FUTURE-001
  agent: disclaimer_agent
  title: Expected future performance mentions taxation
  source: ESMA34-45-1272
  paragraph: "56"
  quote: future performance is subject to taxation which depends on the personal situation of each investor
  trigger: &future_performance
    - '\b(expected|target|projected|forecast|anticipated) (annual )?(returns?|performance|yields?)\b'
    - '\b(rendements?|performances?) (attendue?|cible|prevue?)s?\b'
  required:
    - '\b(taxation|taxes?|tax|fiscalite|fiscale?|imposition)\b'

- id: MC-FUTURE-002
  agent: disclaimer_agent
  title: Expected future performance warns of financial loss
  source: ESMA34-45-1272
  paragraph: "57"
  quote: investment may lead to a financial loss if no guarantee on the capital is in place
  trigger: *future_performance
  required:
    - 'financial loss|loss of capital|lose (some|all|part)|perte (financiere|en capital|de capital)|perdre'

- id: MC-ESG-001
  agent: disclaimer_agent
  title: Sustainability claims say to consider all the fund's characteristics
  source: ESMA34-45-1272
  paragraph: "62"
  quote: the decision to invest in the promoted fund should take into account all the characteristics or objectives
  trigger:
    - '\b(sustainab\w+|esg|sfdr|durab\w+)\b'
  required:
    - 'all the characteristics|toutes? les caracteristiques'

- id: MC-RISK-001
  agent: structure_agent
  title: Rewards are not described without risks
  source: ESMA34-45-1272
  paragraph: "14"
  quote: Marketing communications should not refer to the rewards without referring to the risks
  trigger:
    - '\b(returns?|rewards?|gains?|profits?|rendements?|performances?)\b'
  required:
    - '(?<!no )(?<!sans )(?<!aucun )\b(risks?|risques?)\b(?!-free)'

- id: MC-POLICY-001
  agent: structure_agent
  title: The document describes the investment policy
  source: ESMA34-45-1272
  paragraph: "26(b)"
  quote: Include at least a short description of the investment policy of the fund
  required:
    - "\\binvestment (policy|strategy|objectives?)\\b|\\b(politique|strategie|objectifs?) d.investissement\\b"

- id: MC-COST-001
  agent: structure_agent
  title: Costs come with an explanation of their impact
  source: ESMA34-45-1272
  paragraph: "41"
  quote: include an explanation to allow investors to understand the overall impact of costs
  trigger:
    - '\b(fees?|costs?|charges?|frais|couts?)\b'
  required:
    - '\b(impact\w*|incidence|reduc\w+|redui\w+|affect\w*)\b'

- id: MC-LEVERAGE-001
  agent: structure_agent
  title: Leverage comes with an explanation of the risk of increased losses
  source: ESMA34-45-1272
  paragraph: "27"
  quote: concerning the risk of potential increased losses or returns
  trigger:
    - '\bleverag\w+|\beffet de levier\b'
  required:
    - '\b(increas\w+|greater|amplif\w+|magnif\w+)\b.{0,40}\bloss(es)?\b|\bloss(es)?\b.{0,40}\b(increas\w+|amplif\w+|magnif\w+)\b|\bpertes?\b.{0,40}\b(accru\w*|amplifi\w*)\b|\b(accru\w*|amplifi\w*)\b.{0,40}\bpertes?\b'

- id: LANG-001
  agent: language_objectivity_agent
  title: The language is fair, clear and not misleading
  source: ESMA34-45-1272
  paragraph: "16"
  quote: should contain fair, clear and not misleading information
  # Phrases that are flagged on sight. Finding none is not a pass: that decision needs the LLM.
  trigger:
    - '(?<!not )\brisk[- ]free\b'
    - '(?<!not )\b(guaranteed|assured) (returns?|profits?|gains?|income)\b'
    - '\b(no risk|cannot lose|can.t lose)\b'
    - '(?<!pas )\bsans (aucun )?risques?\b'
    - '\b(rendements?|gains?|profits?) garantis?\b'

- id: CONS-001
  agent: content_coherence_agent
  title: Claims are consistent with the prospectus
  source: ESMA34-45-1272
  paragraph: "20-21"
  quote: should not be inconsistent with, add to, diminish or contradict any information mentioned in the legal or regulatory documents

- id: REG-001
  agent: sql_registration_agent
  title: Each ISIN is valid and in the fund registry
  source: Data quality check using the ISO 6166 check digit and a fictional sample registry; not a legal requirement

- id: REG-002
  agent: sql_registration_agent
  title: The fund may be marketed in the target country
  source: ESMA34-45-1272
  paragraph: "5"
  quote: has received notification that it may market the promoted fund in the targeted host Member State
