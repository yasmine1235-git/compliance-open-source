[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complianceops"
version = "0.1.0"
description = "Open-source LLMOps platform for financial document compliance"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/complianceops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
