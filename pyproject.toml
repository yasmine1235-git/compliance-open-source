[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complianceops"
version = "0.1.0"
description = "Open-source LLMOps platform for financial document compliance"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.2,<2",
    "pillow>=11,<14",
    "pydantic-settings>=2.5,<3",
    # 2.0 corrupts table text ("1.50%" becomes "1 50%") and misses tables; see test_parsers.py.
    "pymupdf>=1.27.2,<1.28",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.18",
    "python-pptx>=1,<2",
    "pyyaml>=6,<7",
    "qdrant-client>=1.15,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
complianceops = "complianceops.cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.7,<6",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/complianceops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["tests"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pptx.*", "pytesseract", "sentence_transformers"]
ignore_missing_imports = true

# pymupdf ships only partial type hints.
[[tool.mypy.overrides]]
module = ["complianceops.ingestion.pdf_parser", "test_api", "test_parsers", "test_rag"]
disallow_untyped_calls = false
